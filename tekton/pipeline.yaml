apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: tax-calculator-ci-cd
spec:
  params:
    - name: REPO_URL
      type: string
    - name: IMAGE
      type: string
  workspaces:
    - name: shared-data
  tasks:
    - name: clone-source
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.REPO_URL)
        - name: revision
          value: main
        - name: deleteExisting
          value: "true"
      workspaces:
        - name: output
          workspace: shared-data

    - name: npm-install
      runAfter:
        - clone-source
      taskRef:
        name: npm
      workspaces:
        - name: source
          workspace: shared-data

    - name: jasmine-tests
      runAfter:
        - npm-install
      taskRef:
        name: jasmine
      workspaces:
        - name: source
          workspace: shared-data

    - name: build-push
      runAfter:
        - jasmine-tests
      taskRef:
        name: tax-calculator-build-push
      params:
        - name: IMAGE
          value: $(params.IMAGE)
      workspaces:
        - name: source
          workspace: shared-data
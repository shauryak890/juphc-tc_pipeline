---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: npm
spec:
  workspaces:
    - name: source
  steps:
    - name: install-dependencies
      image: node:20-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        npm ci
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: jasmine
spec:
  workspaces:
    - name: source
  steps:
    - name: run-tests
      image: node:20-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        npm test
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: tax-calculator-build-push
spec:
  params:
    - name: IMAGE
      type: string
  workspaces:
    - name: source
  steps:
    - name: build-image
      image: quay.io/buildah/stable:v1.35
      workingDir: $(workspaces.source.path)
      securityContext:
        privileged: true
      script: |
        #!/bin/sh
        set -eu
        buildah bud --storage-driver=vfs -t "$(params.IMAGE)" .
        echo "Image built: $(params.IMAGE)"
        echo "Registry push requires registry credentials and configuration."